<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedstoneLogics viewer</title>
<style>
  :root { --ink:#1b1d21; --bg:#fff; --panel:#f7f8f9; --wire:#5b6169;
          --accent:#2f6f4f; --muted:#8b9199; --hot:#d2694a; --line:#d7dadd; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8eaed; --bg:#16181c; --panel:#21242a; --wire:#9aa2ab;
            --accent:#7fd0a3; --muted:#787f87; --hot:#e4835f; --line:#30343a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif, system-ui, sans-serif;
         color:var(--ink); background:var(--bg); }
  header { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
           padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:-.01em; }
  #summary { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns:1fr 300px; height:calc(100vh - 54px); }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  #stage { overflow:hidden; position:relative; cursor:grab; touch-action:none; }
  #stage.drag { cursor:grabbing; }
  aside { border-left:1px solid var(--line); padding:14px 16px; overflow:auto;
          background:var(--panel); font-size:13px; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.07em;
             color:var(--muted); margin:18px 0 6px; }
  aside h2:first-child { margin-top:0; }
  aside ul { margin:0; padding-left:17px; }
  aside li { margin-bottom:3px; word-break:break-word; }
  .warn li { color:var(--hot); }
  #drop { position:absolute; inset:0; display:grid; place-items:center;
          color:var(--muted); text-align:center; padding:24px; line-height:1.7; }
  #drop.hide { display:none; }
  button, label.file { font:inherit; padding:5px 11px; border:1px solid var(--line);
          border-radius:6px; background:var(--bg); color:var(--ink); cursor:pointer; }
  button[aria-pressed="true"] { border-color:var(--hot); color:var(--hot); }
  code { background:var(--panel); padding:1px 5px; border-radius:4px; font-size:12px; }
  svg text { pointer-events:none; user-select:none; }
</style>
</head>
<body>
<header>
  <h1>RedstoneLogics</h1>
  <label class="file">Open&hellip;<input id="file" type="file" accept=".json,.svg" hidden></label>
  <button id="fit">Fit</button>
  <button id="toggleHot" aria-pressed="false">Critical path</button>
  <span id="summary"></span>
</header>
<main>
  <div id="stage">
    <div id="drop">
      Drop a <code>.graph.json</code> here &mdash; or an exported <code>.svg</code>.<br>
      Produced by the in-game Export tab, <code>/rlogic export</code>,
      or the desktop app.
    </div>
    <svg id="view" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <aside id="side"></aside>
</main>
<script src="app.js"></script>
</body>
</html>
