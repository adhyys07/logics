plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.10.0'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"redstonelogics" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://doc/s.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Runs the analysis against hand-built snapshots. No Minecraft, no JUnit.
tasks.register('selfTest', JavaExec) {
	group = 'verification'
	description = 'Builds known circuits in memory and checks what the mapper makes of them.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.redstonelogics.SelfTest'
}

// The companion app, without the Minecraft-facing classes.
tasks.register('desktopJar', Jar) {
	group = 'build'
	description = 'Standalone companion app jar.'
	archiveClassifier = 'desktop'
	from sourceSets.main.output
	exclude 'com/redstonelogics/scanner/**'
	exclude 'com/redstonelogics/command/**'
	exclude 'com/redstonelogics/selection/**'
	exclude 'com/redstonelogics/RedstoneLogicsMod.class'
	exclude 'assets/**'
	exclude 'fabric.mod.json'
	manifest {
		attributes 'Main-Class': 'com.redstonelogics.desktop.DesktopApp'
	}
}

check.dependsOn selfTest

// Publishes a version to an EXISTING Modrinth project: ./gradlew modrinth
//
// Minotaur cannot create the project itself, only add versions to one that is
// already there, so the project has to be made once in the web UI and its slug
// put in modrinth_project_id below.
//
// The token is read from the environment on purpose. gradle.properties is in
// the repository, so a token placed there would be published with the next
// commit.
modrinth {
	token = providers.environmentVariable('MODRINTH_TOKEN')
	projectId = project.findProperty('modrinth_project_id') ?: 'redstonelogics'
	versionNumber = project.version
	versionName = "RedstoneLogics ${project.version}"
	// Beta, not release: the analysis core is well tested but the in-game
	// scanning path is not. The channel should say the same thing the README
	// and the GitHub pre-release flag say.
	versionType = 'beta'
	uploadFile = tasks.named('jar')
	additionalFiles = [tasks.named('sourcesJar')]
	gameVersions = [project.minecraft_version]
	loaders = ['fabric']
	changelog = providers.provider {
		def notes = file('CHANGELOG.md')
		notes.exists() ? notes.text
				: "See https://github.com/adhyys07/logics/releases/tag/v${project.version}"
	}
	dependencies {
		required.project 'fabric-api'
	}
}

// The desktop jar is not a mod and must never be uploaded as one: a launcher
// that installs every file on a version would drop it into mods/.
tasks.named('modrinth') {
	mustRunAfter tasks.named('build')
}
